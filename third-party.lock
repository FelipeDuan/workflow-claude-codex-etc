# ---------------------------------------------------------------- pbakaus/impeccable
# Hooks (plugin/hooks) NÃO são instalados.
# O upstream publica uma variante por ferramenta: plugin/ usa ${CLAUDE_SKILL_DIR}
# e /comandos; .agents/ usa <skill-base-dir> e $comandos (Codex e afins).
skill impeccable  plugin/skills/impeccable   -  claude
skill impeccable  .agents/skills/impeccable  -  codex
agent impeccable  plugin/agents/impeccable-documenter.md           -  claude
agent impeccable  plugin/agents/impeccable-finish-reviewer.md      -  claude
# No Codex as referências da skill chamam impeccable_documenter etc. (underscore),
# então usamos os .toml nativos do upstream em vez de converter os .md.
agent impeccable  .agents/skills/impeccable/agents/impeccable_documenter.toml           -  codex
agent impeccable  .agents/skills/impeccable/agents/impeccable_finish_reviewer.toml      -  codex
# asset-producer e manual-edit-applier ficam de fora (decisão após revisão de segurança).
#
# Motor da impeccable: pré-instalado para a skill NUNCA baixar nada sozinha.
# Versão = plugin/skills/impeccable/scripts/VERSION no commit fixado acima.
# Destino = ${IMPECCABLE_HOME:-~/.impeccable}/bin/<versão>/impeccable, o cache
# versionado que o launcher scripts/impeccable consulta antes de tentar baixar.
# sha256 = campo "digest" da API do GitHub (gh api repos/pbakaus/impeccable/
# releases/tags/engine-v0.1.5), NÃO o arquivo .sha256 publicado no release.
engine impeccable  0.1.5  darwin-arm64  0d48b6e16aa97664fdbe607d5da9ae320e389a1843e0ff1328f8c2530530320d  https://github.com/pbakaus/impeccable/releases/download/engine-v0.1.5/impeccable-darwin-arm64
engine impeccable  0.1.5  darwin-x64    153971b0c00719dff9ebac13370cb7dbbbe12838b696fbaf3f7ab0b1b3726b52  https://github.com/pbakaus/impeccable/releases/download/engine-v0.1.5/impeccable-darwin-x64
engine impeccable  0.1.5  linux-x64     cf5231a4b1ae66996c85b033800b1dad0797e590eae2f21ef2579430af187f19  https://github.com/pbakaus/impeccable/releases/download/engine-v0.1.5/impeccable-linux-x64
engine impeccable  0.1.5  linux-arm64   bc4fa28bc8ccbb018795a99a4ece95ada898a6f1885f14281389d0e6ef2a2f98  https://github.com/pbakaus/impeccable/releases/download/engine-v0.1.5/impeccable-linux-arm64

