# third-party.lock — fontes de terceiros instaladas pelo install.sh
#
# Formato: uma entrada por linha, campos separados por espaços/tabs.
# Linhas vazias e linhas começando com # são ignoradas.
#
#   repo   <id>    <url-git>          <commit-sha>
#   skill  <id>    <caminho-origem>   <nome-destino|->  <alvos>  [include=a,b/c]
#   agent  <id>    <caminho-origem>   <nome-destino|->  <alvos>
#   uvtool <pacote> <versão>          <repo-de-referência>
#   engine <id>    <versão> <os-arch> <sha256> <url-https>
#
# <nome-destino> "-"  = usa o "name:" do frontmatter (fallback: nome da pasta/arquivo).
#                Um nome explícito diferente do frontmatter renomeia a pasta E
#                reescreve o "name:" do frontmatter na cópia instalada.
# <alvos>        = claude | codex | claude,codex
#                  claude -> ~/.claude/skills/<nome> e ~/.claude/agents/<nome>.md
#                  codex  -> ~/.agents/skills/<nome> e ~/.codex/agents/<nome>.toml
# include=       = copia só esses caminhos (relativos à origem) em vez da pasta toda.
# agent .md      = claude: cópia do .md; codex: convertido para .toml.
# agent .toml    = só codex: cópia direta (formato nativo do upstream).
# engine         = binário pré-instalado com verificação de sha256 (ver impeccable).
#
# Para atualizar uma fonte: troque o SHA (git ls-remote <url> HEAD),
# revise o diff upstream e rode ./install.sh --update.

